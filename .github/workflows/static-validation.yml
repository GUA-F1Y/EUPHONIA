name: EUPHONIA static validation

on:
  push:
    branches:
      - main
      - feat/music-streaming-home
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run EUPHONIA static validator
        run: node validate-project.mjs
